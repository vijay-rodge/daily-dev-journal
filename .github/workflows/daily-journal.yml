
name: Gemini Daily Learning Journal

on:
  schedule:
    - cron: "24 12 * * *" # 6:00 PM IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily learning lesson
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise RuntimeError("GEMINI_API_KEY secret is missing.")

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date().isoformat()

          output_dir = Path("journal")
          output_dir.mkdir(exist_ok=True)
          output_file = output_dir / f"{today}.md"

          recent_dates = [
              p.stem
              for p in sorted(output_dir.glob("*.md"))[-14:]
              if p.name != f"{today}.md"
          ]

          prompt = f"""
          Create a useful daily computer science learning lesson
          for {today}.

          Choose one focused topic from Java, Python, DSA,
          algorithms, OOP, databases, APIs, Git, GitHub,
          operating systems, computer networks, cloud computing,
          AI/ML, or software engineering.

          Recent journal dates:
          {json.dumps(recent_dates)}

          Write a Markdown lesson containing:
          1. A clear title and topic
          2. A beginner-friendly explanation
          3. A correct, runnable code example
          4. An explanation of the code
          5. A real-world application
          6. One practice task
          7. A short key takeaway

          Prefer Java or Python. Make the lesson accurate,
          practical, and self-contained.
          Do not claim the reader has completed the lesson.
          Return only the Markdown lesson.
          """

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": api_key
          }

          payload = {
              "contents": [
                  {"parts": [{"text": prompt}]}
              ],
              "generationConfig": {
                  "temperature": 0.7,
                  "maxOutputTokens": 1800
              }
          }

          list_request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models",
              headers=headers
          )

          try:
              with urllib.request.urlopen(
                  list_request, timeout=30
              ) as response:
                  available = json.loads(
                      response.read().decode("utf-8")
                  )
          except urllib.error.HTTPError as error:
              details = error.read().decode(
                  "utf-8", errors="replace"
              )
              raise RuntimeError(
                  f"Could not list Gemini models: "
                  f"HTTP {error.code}: {details}"
              ) from error

          models = []

          for item in available.get("models", []):
              name = item.get("name", "").removeprefix("models/")
              lower_name = name.lower()

              if "generateContent" not in item.get(
                  "supportedGenerationMethods", []
              ):
                  continue

              if any(word in lower_name for word in (
                  "image", "tts", "audio", "embedding",
                  "aqa", "live", "robotics"
              )):
                  continue

              models.append(name)

          models.sort(
              key=lambda name: (
                  "flash" not in name.lower(),
                  "lite" not in name.lower(),
                  "preview" in name.lower()
              )
          )

          if not models:
              raise RuntimeError(
                  "No suitable text-generation models found."
              )

          lesson = ""
          last_error = "No model returned usable text."

          for model in models:
              endpoint = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"models/{model}:generateContent"
              )

              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              print(f"Trying model: {model}")

              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(
                          request, timeout=90
                      ) as response:
                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                      candidates = result.get("candidates", [])
                      parts = (
                          candidates[0].get(
                              "content", {}
                          ).get("parts", [])
                          if candidates else []
                      )

                      generated = "\n".join(
                          part["text"]
                          for part in parts
                          if isinstance(part.get("text"), str)
                      ).strip()

                      if len(generated) >= 200:
                          lesson = generated
                          print(f"Successful model: {model}")
                          break

                      last_error = (
                          f"{model} returned empty or short content."
                      )
                      print(last_error)
                      break

                  except urllib.error.HTTPError as error:
                      details = error.read().decode(
                          "utf-8", errors="replace"
                      )
                      last_error = (
                          f"{model}: HTTP {error.code}: {details}"
                      )
                      print(last_error)

                      if error.code in (429, 500, 502, 503, 504):
                          if attempt == 0:
                              print("Retrying in 5 seconds...")
                              time.sleep(5)
                              continue

                      if error.code in (400, 401, 403, 404):
                          break

                      if error.code not in (
                          429, 500, 502, 503, 504
                      ):
                          raise RuntimeError(last_error) from error

                      break

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError
                  ) as error:
                      last_error = f"{model}: {error}"
                      print(last_error)

                      if attempt == 0:
                          time.sleep(3)
                          continue
                      break

              if lesson:
                  break

          if not lesson:
              raise RuntimeError(
                  "All suitable Gemini models failed. "
                  + last_error
              )

          output_file.write_text(
              f"# Daily Learning Journey\n\n"
              f"## {today}\n\n"
              f"{lesson}\n",
              encoding="utf-8"
          )

          print(f"Generated lesson: {output_file}")
          print(f"Lesson length: {len(lesson)} characters")
          PY

      - name: Commit and push daily lesson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add journal/

          if ! git diff --cached --quiet; then
            git commit -m "docs: daily learning lesson"
            git push
          else
            echo "No changes to commit."
          fi
