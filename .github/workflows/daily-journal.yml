name: Gemini Daily Developer Journal

on:
  schedule:
    - cron: "30 20 * * *" # Midnight IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily journal with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_USERNAME: vijay-rodge
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path

          username = os.environ["GITHUB_USERNAME"]
          api_key = os.environ["GEMINI_API_KEY"]

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)

          def get_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          # Retrieve recent public GitHub activity.
          url = (
              f"https://api.github.com/users/{username}/events"
              "?per_page=100"
          )
          events = get_json(url, {
              "Accept": "application/vnd.github+json",
              "User-Agent": "daily-dev-journal"
          })

          recent = []
          for event in events:
              created = datetime.fromisoformat(
                  event["created_at"].replace("Z", "+00:00")
              )
              if cutoff <= created <= now:
                  recent.append({
                      "type": event["type"],
                      "repo": event["repo"]["name"],
                      "created_at": event["created_at"],
                      "details": event.get("payload", {})
                  })

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date().isoformat()

          if recent:
              prompt = f"""
              Write a concise developer journal for {today}.
              Base it ONLY on these observed GitHub events:
              {json.dumps(recent, ensure_ascii=False)}

              Include:
              - Activity summary
              - Repositories involved
              - Verified accomplishments
              - Possible next steps

              Do not invent code changes, learning, or achievements.
              If evidence is insufficient, explicitly say so.
              Return Markdown only.
              """
              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-2.5-flash:generateContent"
              )
              body = json.dumps({
                  "contents": [{
                      "parts": [{"text": prompt}]
                  }]
              }).encode()

              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=60) as r:
                  result = json.loads(r.read())

              report = result["candidates"][0]["content"]["parts"][0]["text"]
          else:
              report = (
                  f"# Developer Journal — {today}\n\n"
                  "No GitHub events were found in the last 24 hours "
                  "through the public Events API. This does not prove "
                  "that no work was done.\n"
              )

          Path("journal").mkdir(exist_ok=True)
          Path(f"journal/{today}.md").write_text(
              f"# Developer Journal — {today}\n\n"
              f"{report}\n\n"
              "---\n"
              "Generated from observable GitHub activity.\n",
              encoding="utf-8"
          )

          print(f"Journal generated for {today}")
          print(f"Recent events found: {len(recent)}")
          PY

      - name: Commit and push journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add journal/
          git commit -m "docs: daily developer journal" \
            || echo "No changes to commit"
          git push
